---
# Postgres is only enabled after the existing services have completed executor cutover.
- name: Install trusted Postgres release and provision tenants
  hosts: servers
  become: true
  vars:
    uye_deploy_postgres_enabled: true
    uye_deploy_timer_enabled: false
  pre_tasks:
    - name: Require completed deployer cutover
      ansible.builtin.command:
        argv: [systemctl, is-active, uye-deploy.timer]
      changed_when: false

    - name: Require a Dockerless poller before creating database resources
      ansible.builtin.command:
        argv: [docker, inspect, infra-runner-deployer-1]
      register: uye_postgres_poller
      changed_when: false

    - name: Refuse legacy poller with Docker access
      ansible.builtin.assert:
        that:
          - "'DOCKER_HOST=' not in (uye_postgres_poller.stdout | from_json)[0].Config.Env | join(' ')"
          - >-
            (uye_postgres_poller.stdout | from_json)[0].HostConfig.Binds | default([])
            | select('search', 'docker.sock|/plugins|/workspace') | list | length == 0

    - name: Stop executor timer before changing its Postgres target table
      ansible.builtin.systemd_service:
        name: uye-deploy.timer
        state: stopped

  roles:
    - uye_deploy

  tasks:
    - name: Verify Postgres release pair before creating resources
      ansible.builtin.command:
        argv: [/usr/local/libexec/uye-deploy, --check, --target, infra-postgres]
      changed_when: false

    - name: Create database volumes with their stable names
      ansible.builtin.command:
        argv: [docker, volume, create, "{{ item }}"]
      loop: [infra-postgres_postgres-data, infra-postgres_postgres-backups]
      changed_when: false

    - name: Create stable Postgres network if absent
      ansible.builtin.command:
        argv: [docker, network, create, postgres-net]
      register: uye_postgres_network_create
      failed_when: uye_postgres_network_create.rc != 0 and 'already exists' not in uye_postgres_network_create.stderr
      changed_when: uye_postgres_network_create.rc == 0

    - name: Validate trusted Postgres Compose manifests
      ansible.builtin.command:
        argv: [docker, compose, --project-name, infra-postgres, -f, "{{ item }}", config, --no-env-resolution, --quiet]
      loop:
        - /etc/uye-deploy/compose/postgres.yml
        - /etc/uye-deploy/compose/postgres-backup.yml
      changed_when: false

    - name: Apply signed Postgres and backup release
      ansible.builtin.command:
        argv: [/usr/local/libexec/uye-deploy, --target, infra-postgres]
      changed_when: true

    - name: Take the complete initial backup
      ansible.builtin.command:
        argv: [docker, exec, infra-postgres-postgres-backup-1, /backup.sh]
      changed_when: true

    - name: Confirm initial backup contains a complete marker
      ansible.builtin.command:
        argv: [docker, exec, infra-postgres-postgres-backup-1, sh, -c, "find /backups -mindepth 2 -maxdepth 2 -name complete -type f | grep -q ."]
      changed_when: false

    - name: Re-enable executor timer after backup succeeds
      ansible.builtin.systemd_service:
        name: uye-deploy.timer
        state: started
        enabled: true
