---
- name: Reject retired plugin deployment procedure
  hosts: servers
  gather_facts: false
  tasks:
    - name: Use the signed executor migration instead
      ansible.builtin.fail:
        msg: >-
          This legacy playbook could restore deployer plugin mounts or an unverified
          Compose update. Use deployer-prepare.yml and deployer-cutover.yml;
          perform explicit signed-digest rollback through the executor procedure.
