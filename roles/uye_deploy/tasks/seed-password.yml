---
- name: Check whether tenant password already exists
  ansible.builtin.set_fact:
    uye_deploy_password_present: >-
      {{ (uye_deploy_existing_tenant_env.content | b64decode
          | regex_findall('(?m)^' + uye_deploy_password_key + '=([0-9a-f]{64})$')) | length == 1 }}
  no_log: true

- name: Generate missing tenant password
  ansible.builtin.command:
    argv: [openssl, rand, -hex, '32']
  register: uye_deploy_new_password
  when: not uye_deploy_password_present
  changed_when: true
  no_log: true

- name: Add missing tenant password
  ansible.builtin.lineinfile:
    path: /etc/uye-deploy/secrets/postgres-tenants.env
    regexp: "^{{ uye_deploy_password_key }}="
    line: "{{ uye_deploy_password_key }}={{ uye_deploy_new_password.stdout }}"
    owner: root
    group: uye-postgres-provision
    mode: '0640'
  when: not uye_deploy_password_present
  no_log: true
