services:
  portainer:
    image: __UYE_VERIFIED_IMAGE__
    container_name: portainer
    restart: unless-stopped
    command:
      - -H
      - tcp://portainer-proxy:2375
      - --templates
      - https://raw.githubusercontent.com/uye-ltd/infra-portainer/main/docker/portainer/templates/templates.json
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - portainer-data:/data
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:9000/api/status]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [portainer-net]
volumes:
  portainer-data:
    external: true
    name: infra-portainer_portainer-data
networks:
  portainer-net:
    external: true
    name: portainer-net
