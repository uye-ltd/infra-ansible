---
# ufw
ufw_rules:
  - port: "22"
    comment: SSH

# caddy
caddy_acme_email: "igorlashkov23@gmail.com"
# Issue all certs via the Cloudflare DNS-01 challenge (no public inbound needed).
caddy_extra_global_options: |
  acme_dns cloudflare {env.CLOUDFLARE_API_TOKEN}
caddy_cloudflare_api_token: >-
  {{ lookup('env', 'CLOUDFLARE_API_TOKEN')
     or (lookup('ansible.builtin.file', inventory_dir + '/../.env', errors='ignore')
         | default('', true)
         | regex_findall('(?m)^CLOUDFLARE_API_TOKEN=(.+)$')
         | join('')) }}
# navidrome stays public; the other three are VPN-only (403 for non-10.0.0.0/24).
caddy_sites_config: |
  navidrome.uye.rocks {
    reverse_proxy localhost:4533
  }
  
  navidromed.uye.rocks {
    reverse_proxy localhost:4533
  }

  filebrowser.uye.rocks {
    @notvpn not remote_ip 10.0.0.0/24
    respond @notvpn 403
    reverse_proxy localhost:3001
  }
  
  vault.uye.rocks {
    @notvpn not remote_ip 10.0.0.0/24
    respond @notvpn 403
    reverse_proxy localhost:8200
  }
  
  portainer.uye.rocks {
    @notvpn not remote_ip 10.0.0.0/24
    respond @notvpn 403
    reverse_proxy localhost:9000
  }

# docker
docker_users:
  - rwrotson

docker_address_pools:
  - base: "10.89.0.0/16"
    size: 24
# Match the Kata registration installed on the host. Removing this from
# daemon.json on a later Ansible run would silently disable Kata.
docker_runtimes:
  kata:
    runtimeType: /opt/kata/runtime-rs/bin/containerd-shim-kata-v2
    options:
      ConfigPath: /opt/kata/share/defaults/kata-containers/runtime-rs/configuration-clh-runtime-rs.toml

# wireguard — keys come from secrets/wireguard.yml (generated by playbooks/keygen.yml)
# Split-horizon DNS: VPN clients resolve uye.rocks to the wg server (10.0.0.1) so
# their traffic enters over wg0 and Caddy sees a 10.0.0.x source (passes the 403 gate).
wireguard_dnsmasq_internal_domains:
  - uye.rocks
# Endpoint host must always resolve to the public IP (even for connected clients),
# so it is carved out of the uye.rocks split-horizon and forwarded upstream.
wireguard_dnsmasq_public_names:
  - vpn.uye.rocks
wireguard_peers:
  - name: macbook
    public_key: "{{ wg_peers_keys.macbook.public_key }}"
    preshared_key: "{{ wg_peers_keys.macbook.psk }}"
    allowed_ips: "10.0.0.2/32"
    persistent_keepalive: 25
  - name: android
    public_key: "{{ wg_peers_keys.android.public_key }}"
    preshared_key: "{{ wg_peers_keys.android.psk }}"
    allowed_ips: "10.0.0.3/32"
    persistent_keepalive: 25

# filebrowser
filebrowser_admin_password: >-
  {{ lookup('community.general.onepassword', 'filebrowser-admin-password', errors='ignore')
     or lookup('env', 'FILEBROWSER_ADMIN_PASSWORD')
     or (lookup('ansible.builtin.file', inventory_dir + '/../.env', errors='ignore')
         | default('', true)
         | regex_findall('(?m)^FILEBROWSER_ADMIN_PASSWORD=(.+)$')
         | join('')) }}
filebrowser_user: rwrotson
filebrowser_root_dir: /data

# git
git_github_app:
  app_id: "3483504"
  installation_id: "126571070"
  key_path: /Users/macbook/.ssh/github-app-uye.pem
git_repos:
  - repo: "https://x-access-token:{{ git_app_token }}@github.com/uye-ltd/navidrome-hub.git"
    dest: /home/rwrotson/navidrome-hub
    version: main
    user: rwrotson

# runner
runner_github_org: uye-ltd
runner_github_repo: infra-runner
runner_runtime: kata
runner_github_token: >-
  {{ lookup('env', 'RUNNER_GITHUB_TOKEN')
     or (lookup('ansible.builtin.file', inventory_dir + '/../.env', errors='ignore')
         | default('', true)
         | regex_findall('(?m)^RUNNER_GITHUB_TOKEN=(.+)$')
         | join('')) }}

# storage
storage_mounts:
  - src: UUID=0bc0f958-5a66-4aef-a742-469eff88236d
    path: /data
    fstype: ext4
    opts: defaults
    state: mounted
